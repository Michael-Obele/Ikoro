# Release pipeline for the Android app (M12-T1).
#
# Merging the release PR cut by release-please tags `v<version>` where <version>
# is exactly apps/app/package.json's `version`, and this builds the static SPA,
# syncs it into the Capacitor Android project, signs a release APK + AAB, and
# attaches both to a GitHub Release. You do not tag by hand any more — see
# .github/workflows/release-please.yml and RELEASE.md.
#
# Secrets (see RELEASE.md): ANDROID_KEYSTORE_B64,
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
#
# BUN ONLY: this repo never uses npm/npx/pnpm/yarn. `bunx` is the npx
# equivalent and is what runs the Capacitor CLI.
#
# ---------------------------------------------------------------------------
# VERSION POLICY — release-please decides the number, this file checks it.
# Full runbook: RELEASE.md.
#
#   every commit is a PATCH      whatever the type — `feat:` included
#                                (release-please: bump-patch-for-minor-pre-major)
#   a `!` commit is a MINOR      type!: / type(scope)!: / a BREAKING CHANGE:
#                                footer (release-please: bump-minor-pre-major)
#   no MAJOR before 1.0.0
#
# release-please reads the commits and maintains the release PR; merging it
# writes package.json, the changelog, and the tag that starts this run. This
# workflow then re-derives the bump from the commits since the previous tag and
# fails when the tag is smaller than they claim — and when any of those commits
# does not parse, because release-please drops an unreadable message without
# failing anything. A bigger bump is always allowed; only a smaller one is not,
# since a published version can never be taken back. The arithmetic lives in
# apps/app/scripts/version.ts.
# ---------------------------------------------------------------------------

name: Release Android

on:
  push:
    tags:
      - 'v*'

# One release at a time per tag; never cancel a half-finished upload.
concurrency:
  group: release-android-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build signed APK + AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # The version-policy guard compares the tag against the commits since the
      # *previous* tag, and `git describe` has to see every tag — a shallow
      # clone has neither the history nor the tags, and the guard would then
      # pass by finding nothing to check. Full history is the price of a
      # version that cannot lie about what it contains.
      - name: Checkout (full history + tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # setup-android@v3's default package list starts with the retired `tools`
      # package, which Google removed from the SDK repository — sdkmanager then
      # exits 1 with "Failed to find package 'tools'" before ANDROID_HOME is
      # even exported (upstream issue android-actions/setup-android#537). We
      # pin the exact packages we need instead: no `tools`, ever. AGP 8.13
      # resolves the matching platform itself, but being explicit keeps the
      # runner image's preinstalled packages from silently changing under us.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # A tag that does not match the app version would ship a build whose
      # versionName disagrees with the release it is attached to.
      - name: Assert tag matches apps/app/package.json version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./apps/app/package.json').version")
          echo "tag=$TAG package.json=$PKG"
          [ "$TAG" = "$PKG" ] || { echo "tag $TAG != package.json $PKG"; exit 1; }

      # The version policy, enforced. Say what the tag claims and what the
      # commits since the last one claim — release-please computed the former,
      # this recomputes it, and a disagreement means a release PR was merged
      # over commits it never saw. Deliberately before the keystore is decoded:
      # a wrong version should cost seconds, not a signed build nobody can
      # publish. See the header.
      - name: Assert version bump matches the commits since the last tag
        run: bun apps/app/scripts/version.ts check

      # The keystore is never committed. It arrives base64-encoded in a secret
      # and is written to $RUNNER_TEMP, which is wiped with the runner.
      - name: Decode keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "ANDROID_KEYSTORE_B64 is not set — see RELEASE.md"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ikoro.keystore"
          test -s "$RUNNER_TEMP/ikoro.keystore"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `bun --cwd apps/app run build` does NOT work: in bun 1.4 the `--cwd`
      # flag is not accepted before `run`, so the command prints bun's usage
      # and exits 0 without building anything — and the next step then fails
      # with "Could not find the web assets directory: ./build". Put the flag
      # after `run` (or use working-directory). Verified locally.
      - name: Build web app
        run: bun run --cwd apps/app build

      # Copies apps/app/build into the Android project and regenerates
      # capacitor.build.gradle / capacitor.settings.gradle.
      - name: Sync Capacitor
        working-directory: apps/app
        run: bunx cap sync android

      - name: Assemble signed APK + AAB
        working-directory: apps/app/android
        env:
          IKORO_KEYSTORE: ${{ runner.temp }}/ikoro.keystore
          IKORO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          IKORO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          IKORO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease :app:assembleRelease --no-daemon --stacktrace

      # Fail loudly if the signing block silently did not apply: an unsigned
      # APK cannot be installed over a previous release.
      - name: Verify artifacts are signed
        shell: bash
        working-directory: apps/app/android/app/build/outputs
        run: |
          set -euo pipefail
          ls -l apk/release/app-release.apk bundle/release/app-release.aab
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs apk/release/app-release.apk

      # Rename to a public-facing name: a release asset called "app-release.apk"
      # tells the person downloading it nothing. "Ikoro-v0.3.0.apk" does. The
      # tag IS the version (the assert step above guarantees tag == package.json
      # version), so github.ref_name is the right source — no second copy of the
      # version to drift. Renaming happens AFTER signing verification so the
      # verify step always runs against the path Gradle actually wrote.
      - name: Rename artifacts to Ikoro-<version>
        shell: bash
        working-directory: apps/app/android/app/build/outputs
        run: |
          set -euo pipefail
          cp apk/release/app-release.apk "Ikoro-${GITHUB_REF_NAME}.apk"
          cp bundle/release/app-release.aab "Ikoro-${GITHUB_REF_NAME}.aab"
          ls -l "Ikoro-${GITHUB_REF_NAME}.apk" "Ikoro-${GITHUB_REF_NAME}.aab"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Ikoro ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            apps/app/android/app/build/outputs/Ikoro-${{ github.ref_name }}.apk
            apps/app/android/app/build/outputs/Ikoro-${{ github.ref_name }}.aab
