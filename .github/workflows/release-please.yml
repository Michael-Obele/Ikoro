# release-please owns the version number. See release-please-config.json.
#
# It runs on every push to master, keeps ONE open release PR that accumulates
# the commits since the last tag, and — when you merge that PR — bumps
# apps/app/package.json, writes the changelog, and cuts the tag. That tag is
# then handed to release-android.yml and release-desktop.yml, which build and
# publish the APK + AAB and the Linux desktop bundles.
#
# WHY THE BUILD IS DISPATCHED EXPLICITLY, AND NOT TRIGGERED BY THE TAG PUSH:
# events caused by GITHUB_TOKEN do not create workflow runs, so a tag pushed by
# release-please would never start the build — leaving a release on the Releases
# tab with no artifacts and no failure anywhere to explain it. `workflow_dispatch`
# is the documented exception: it always creates a run, whatever token asked for
# it. So this job calls it directly. No PAT, no second secret to rotate.
#
# BUN ONLY: this repo never uses npm/npx/pnpm/yarn.

name: Release Please

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write
  # Needed to dispatch release-android.yml. Without it the dispatch is a 403.
  actions: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release:
    name: Maintain the release PR
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Merging the release PR leaves its branch behind, and release-please
      # recreates it on the next push anyway. Delete it, so the branch list only
      # ever holds branches someone is working on. A 404 is the normal answer
      # when release-please already cleaned up.
      #
      # The `--components--app` suffix is release-please's own naming for a
      # manifest-mode component; it is not in the docs, it is in the run log.
      - name: Delete the release branch after a merge
        if: "${{ steps.release.outputs['apps/app--release_created'] == 'true' }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for branch in \
            "release-please--branches--master--components--app" \
            "release-please--branches--master"; do
            if gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" 2>/dev/null; then
              echo "deleted $branch"
            else
              echo "$branch was already gone"
            fi
          done

      # The tag has to be readable here: dispatching at an empty ref would run
      # the builds against master and trip their own tag assertions instead of
      # failing where the bug is.
      - name: Check the tag release-please just cut
        id: tag
        if: "${{ steps.release.outputs['apps/app--release_created'] == 'true' }}"
        env:
          TAG: ${{ steps.release.outputs['apps/app--tag_name'] }}
        run: |
          set -euo pipefail
          if [ -z "${TAG:-}" ]; then
            echo "release_created is true but apps/app--tag_name is empty."
            echo "release-please changed its output keys — dispatch by hand:"
            echo "  gh workflow run release-android.yml --ref v<version>"
            echo "  gh workflow run release-desktop.yml --ref v<version>"
            exit 1
          fi
          echo "tag=$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # workflow_dispatch is the one event GITHUB_TOKEN is allowed to trigger.
      # --ref <tag> makes GITHUB_REF_NAME the tag, which is what the builds
      # assert on, and makes their checkouts land on the tagged commit.
      #
      # --repo is required: this job has no checkout, so `gh` has no git remote
      # to infer the repository from and dies with "not a git repository".
      - name: Start the Android and Desktop builds for that tag
        if: "${{ steps.tag.outputs.tag != '' }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          gh workflow run release-android.yml --ref "$TAG" --repo "$GITHUB_REPOSITORY"
          echo "dispatched release-android.yml at $TAG"
          gh workflow run release-desktop.yml --ref "$TAG" --repo "$GITHUB_REPOSITORY"
          echo "dispatched release-desktop.yml at $TAG"
