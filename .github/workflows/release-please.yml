# release-please owns the version number. See release-please-config.json.
#
# It runs on every push to master, keeps ONE open release PR that accumulates
# the commits since the last tag, and — when you merge that PR — bumps
# apps/app/package.json, writes the changelog, and cuts the tag. The tag is what
# starts release-android.yml, which builds and publishes the APK + AAB.
#
# WHY A PAT (secrets.RELEASE_PLEASE_TOKEN) AND NOT THE DEFAULT GITHUB_TOKEN:
# events caused by GITHUB_TOKEN do not create workflow runs. release-please
# would cut the tag, report success, and the build would never start — a release
# that exists on the Releases tab with no artifacts, and no failure anywhere to
# explain it. Handing the action a PAT makes its tag push an ordinary push.
#
# BUN ONLY: this repo never uses npm/npx/pnpm/yarn.

name: Release Please

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release:
    name: Maintain the release PR
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Fail loudly instead of silently producing a tag nobody builds. Without
      # the PAT, release-please still opens and merges PRs — using GITHUB_TOKEN —
      # and the release would look successful while release-android.yml stayed
      # asleep.
      - name: Require the PAT the build needs
        env:
          TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "RELEASE_PLEASE_TOKEN is not set — see RELEASE.md, step 3."
            echo "With the default GITHUB_TOKEN, release-please cuts the tag but"
            echo "release-android.yml never runs for it."
            exit 1
          fi

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Merging the release PR leaves its branch behind, and release-please
      # recreates it on the next push anyway. Delete it, so the branch list only
      # ever holds branches someone is working on. The per-package output is
      # keyed by the manifest path.
      - name: Delete the release branch after a merge
        if: "${{ steps.release.outputs['apps/app--release_created'] == 'true' }}"
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          set -euo pipefail
          branch="release-please--branches--master"
          if gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" 2>/dev/null; then
            echo "deleted $branch"
          else
            echo "$branch was already gone"
          fi
