# Ikoro landing site: Netlify build config.
# Config only: creating the Netlify site and deploying stay human actions.
# Root toml, root base: bun.lock and packageManager live at the repo root,
# so Netlify installs with bun there and builds just the landing workspace.
[build]
command = "bun run --filter landing build"
# `base` is set explicitly, and must stay set. It is the repo root, which is
# also the default -- but the site setting in the Netlify UI has been pointing
# at apps/landing, and a root-level `netlify.toml` base overrides the UI. Without
# this line, `publish` (always resolved RELATIVE to base) becomes
# apps/landing/apps/landing/build and the deploy fails after a green build.
# With it, the landing build still installs from the root lockfile.
base = "."
publish = "apps/landing/build"
# Monorepo default rebuilds on every root push; scope it to the site. Also watch apps/app/package.json because the site derives its fallback version from that file, so a bump there must rebuild the site.
# https://docs.netlify.com/build/configure-builds/ignore-builds
ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF apps/landing/ netlify.toml apps/app/package.json"

[build.environment]
NODE_VERSION = "24"
# Must match packageManager in package.json. bun.lock is lockfileVersion 2,
# which only bun >= 1.4 can read; the build image default (1.3.x) rejects it,
# silently ignores the lockfile and resolves deps from latest instead.
BUN_VERSION = "1.4.0"

[[headers]]
for = "/_app/immutable/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
