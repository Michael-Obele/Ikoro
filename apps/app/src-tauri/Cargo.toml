[package]
name = "ikoro"
version = "0.1.0"
description = "An Ịbani is the slit gong its striker carries: it is heard when it is sounded, and not a moment before."
authors = ["Michael Obele"]
edition = "2021"
rust-version = "1.77"

# The library target is what the desktop binary links against; keeping the
# plugin out of it means `cargo test` builds a fraction of the dependency tree.
[lib]
name = "ikoro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true