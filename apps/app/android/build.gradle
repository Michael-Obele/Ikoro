// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // Kotlin, for the native alarm. The product's promise is that a
        // reminder actually rings, which needs a foreground service and a
        // full-screen activity -- and those read better, and less
        // dangerously, in Kotlin than in Java. Resolved from the
        // mavenCentral() repository declared above.
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.0'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
