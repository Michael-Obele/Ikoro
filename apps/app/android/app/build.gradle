apply plugin: 'com.android.application'

// The Kotlin toolchain, applied alongside the Android one. Its plugin
// (declared in the root buildscript) also puts kotlin-stdlib on this
// module's compile classpath, so nothing else in dependencies has to
// change. Everything under src/main/java/com/michaelobele/ikoro/alarm
// is Kotlin; the pre-existing Java sources are untouched.
apply plugin: 'kotlin-android'

// The APK's version is the app's version. Read from package.json rather than
// hard-coded here, because the two drifting apart is how a release ships with
// Settings reporting "0.1.0" and the package manager reporting "1.0".
def appPkg = new groovy.json.JsonSlurper().parseText(file('../../package.json').text)
def appVersionName = appPkg.version
// Android needs a monotonically increasing integer; derive it from the semver
// so "0.1.0" -> 100, "0.2.0" -> 200, "1.0.0" -> 10000.
def appVersionParts = appVersionName.tokenize('.')*.toInteger()
def appVersionCode = appVersionParts[0] * 10000 + (appVersionParts[1] ?: 0) * 100 + (appVersionParts[2] ?: 0)

android {
    namespace = "com.michaelobele.ikoro"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.michaelobele.ikoro"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Release signing is driven entirely by the environment, so a local
    // `./gradlew assembleRelease` with no keystore still produces an unsigned
    // artifact instead of failing configuration. CI (see
    // .github/workflows/release-android.yml) exports the four IKORO_* vars
    // from repository secrets; docs/RELEASE.md is the runbook.
    //
    // The `if` is deliberate: assigning a signingConfig whose storeFile does
    // not exist makes AGP fail at configuration time, which would break every
    // local release build for someone who has never created a keystore.
    signingConfigs {
        release {
            def ks = System.getenv('IKORO_KEYSTORE')
            if (ks != null && file(ks).exists()) {
                storeFile file(ks)
                storePassword System.getenv('IKORO_KEYSTORE_PASSWORD')
                keyAlias System.getenv('IKORO_KEY_ALIAS')
                keyPassword System.getenv('IKORO_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (System.getenv('IKORO_KEYSTORE') != null) {
                signingConfig signingConfigs.release
            }
        }
    }
}

// Kotlin and Java MUST agree on a JVM target, and this is NOT optional:
// Gradle 8.14 + AGP 8.13 report a mismatch as an ERROR, not a warning --
// `Inconsistent JVM-target compatibility detected for tasks
// 'compileDebugJavaWithJavac' (21) and 'compileDebugKotlin' (1.8)`. The Java
// side is pinned to 21 by the generated capacitor.build.gradle
// (sourceCompatibility/targetCompatibility JavaVersion.VERSION_21), while the
// Kotlin Gradle Plugin 2.2.0 still defaults its jvmTarget to 1.8, so without
// this block the debug build fails outright and no Kotlin file in
// src/main/java/com/michaelobele/ikoro/alarm ever compiles.
//
// jvmToolchain(21) is the preferred form: it pins Kotlin's jvmTarget AND the
// Java toolchain that javac runs under to the same JDK 21, so the two can never
// drift apart again. `kotlinOptions { jvmTarget = '21' }` would fix only the
// Kotlin side and is deprecated on KGP 2.x anyway.
kotlin {
    jvmToolchain(21)
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
